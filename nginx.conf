events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=30s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # --- HTTP: LAN / IP-Zugriff (Default) → Summerleague ---
    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:3001;
        }
    }

    # --- HTTP: schwarzerspatz.com → Ferienwohnung (direkt, bis Zertifikat bereit) ---
    server {
        listen 80;
        server_name schwarzerspatz.com www.schwarzerspatz.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://ferienwohnung-app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- HTTP: Summerleague → HTTPS Redirect ---
    server {
        listen 80;
        server_name www.tennis-summerleague.de 3cmzgoc2hfvlps2u.myfritz.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: Summerleague ---
    server {
        listen 443 ssl http2;
        server_name www.tennis-summerleague.de 3cmzgoc2hfvlps2u.myfritz.net;

        ssl_certificate     /etc/letsencrypt/live/3cmzgoc2hfvlps2u.myfritz.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/3cmzgoc2hfvlps2u.myfritz.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:3001;
        }
    }

    # --- HTTPS: schwarzerspatz.com → Ferienwohnung ---
    # Zertifikat holen (einmalig, sobald CNAME auf 3cmzgoc2hfvlps2u.myfritz.net propagiert):
    #   sudo docker exec summerleague-certbot certbot certonly \
    #     --webroot -w /var/www/certbot \
    #     -d schwarzerspatz.com -d www.schwarzerspatz.com \
    #     --email deine@email.de --agree-tos --no-eff-email
    # Danach:
    #   1. Diesen Block einkommentieren
    #   2. Im HTTP-Block oben "location /" ersetzen durch: return 301 https://schwarzerspatz.com$request_uri;
    #   3. sudo docker exec summerleague-nginx nginx -s reload
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name schwarzerspatz.com www.schwarzerspatz.com;
    #     ssl_certificate     /etc/letsencrypt/live/schwarzerspatz.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/schwarzerspatz.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     location / {
    #         proxy_pass http://ferienwohnung-app:3000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
}
